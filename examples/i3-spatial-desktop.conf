# i3-spatial-desktop: relative workspaces for i3.
#
# A desktop is an origin workspace ($ws1 … $ws10) plus satellite workspaces
# around it (`4:db: ←`, `4:db: →`, `4:db: ↑`).
#
# Load from your i3 config, after $mod and $ws1..$ws10 are defined:
#
#     set $mod  Mod4
#     set $ws1  "1:be"
#     ...
#     set $ws10 "10:com"
#     include ~/.config/i3/i3-spatial-desktop.conf
#
# Every binding below is an i3 `nop`: i3 itself does nothing, but reports
# the key press over its IPC socket, and the i3-spatial-desktop daemon executes it.

# One daemon per session. Restarting i3 replaces it; a reload keeps it.
# --desktop-origin-hotkey=down: $mod+Down returns to the origin from any
# satellite. See the README's Navigation section for the other modes.
exec_always --no-startup-id ~/.cargo/bin/i3-spatial-desktop --desktop-origin-hotkey=down daemon
set $rel nop i3-spatial-desktop

# With several monitors, each desktop stays on one of them. To spread the
# current desktop over all of them instead, add one of these to the line
# above (see "Several monitors" in the README):
#   --multimonitor-mode=location-per-monitor   each monitor shows its own location
#   --multimonitor-mode=pan                    the arrows slide all monitors together

# Desktop origins. Unlike `workspace number N`, never lands on a satellite.
bindsym $mod+1             $rel goto $ws1
bindsym $mod+2             $rel goto $ws2
bindsym $mod+3             $rel goto $ws3
bindsym $mod+4             $rel goto $ws4
bindsym $mod+5             $rel goto $ws5
bindsym $mod+6             $rel goto $ws6
bindsym $mod+7             $rel goto $ws7
bindsym $mod+8             $rel goto $ws8
bindsym $mod+9             $rel goto $ws9
bindsym $mod+0             $rel goto $ws10
bindsym $mod+Shift+1       $rel send $ws1
bindsym $mod+Shift+2       $rel send $ws2
bindsym $mod+Shift+3       $rel send $ws3
bindsym $mod+Shift+4       $rel send $ws4
bindsym $mod+Shift+5       $rel send $ws5
bindsym $mod+Shift+6       $rel send $ws6
bindsym $mod+Shift+7       $rel send $ws7
bindsym $mod+Shift+8       $rel send $ws8
bindsym $mod+Shift+9       $rel send $ws9
bindsym $mod+Shift+0       $rel send $ws10

# Workspaces of the current desktop: ← origin → ↑, Down = origin
bindsym $mod+Up            $rel focus up
bindsym $mod+Down          $rel focus down
bindsym $mod+Left          $rel focus left
bindsym $mod+Right         $rel focus right
bindsym $mod+Shift+Up      $rel move up
bindsym $mod+Shift+Down    $rel move down
bindsym $mod+Shift+Left    $rel move left
bindsym $mod+Shift+Right   $rel move right

# Rename the current desktop. A plain rename is enough: the daemon renames
# the satellites to match, and puts the number back if you typed only a
# label (Bar on desktop 4 → 4:Bar).
bindsym $mod+Shift+R       exec i3-input -F 'rename workspace to "%s"' -P 'Rename desktop: '

# The whole desktop to the neighbouring monitor.
bindsym $mod+bracketright  $rel output right
bindsym $mod+bracketleft   $rel output left

# With --multimonitor-mode=location-per-monitor: keep this monitor on the
# workspace it shows while the others change desktop; again to let it go.
# bindsym $mod+p           $rel pin-monitor

# Plain i3: windows within a workspace. Arrows are taken by i3-spatial-desktop above.
bindsym $mod+h             focus left
bindsym $mod+j             focus down
bindsym $mod+k             focus up
bindsym $mod+l             focus right
bindsym $mod+Shift+h       move left
bindsym $mod+Shift+j       move down
bindsym $mod+Shift+k       move up
bindsym $mod+Shift+l       move right
