[package]
name = "i3-spatial-desktop"
version = "0.1.0"
edition = "2024"
description = "Relative workspace layers (↑ ← →) for i3 and sway"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
